<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vericard · 工作台</title>
  <link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="app-pages.css">
</head>
<body>
<aside class="app-shell-sidebar" data-app-shell data-page="workspace" aria-label="Vericard 导航"></aside>
<div class="shell-content">
  <header class="shell-header">
    <nav class="breadcrumb" aria-label="页面位置"><span aria-current="page">工作台</span></nav>
    <div class="shell-header-actions"><span class="shell-local">本机运行</span></div>
  </header>
  <main class="product-page home-workbench">
    <header class="home-intro">
      <p class="eyebrow">本机 · 消费决策</p>
      <h1>工作台</h1>
      <p>比较备选套餐，管理已经买到的权益。</p>
    </header>

    <section class="home-resume panel" id="homeResume" hidden aria-labelledby="homeResumeTitle">
      <div class="home-resume-copy">
        <span class="badge" data-tone="warning">进行中</span>
        <strong id="homeResumeTitle">上次比较</strong>
        <span class="muted" id="homeResumeMeta"></span>
      </div>
      <a class="button secondary" id="homeResumeLink" href="comparison.html#optionsSection">继续 →</a>
    </section>

    <div class="home-board">
      <section class="panel home-analyze" id="analyze" aria-labelledby="analyzeTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">购前分析</p>
            <h2 id="analyzeTitle">你想解决哪个问题？</h2>
          </div>
        </div>
        <div class="home-options">
          <a class="home-option" href="analyze.html">
            <span class="shortcut-icon" data-icon="layers" aria-hidden="true"></span>
            <strong>分析一个套餐</strong>
            <span class="muted">已经看中一张卡？左边核对要素，右边实时看到回本和真实成本。</span>
            <span class="home-option-meta"><span>1 个套餐 · 核对与试算同页</span><span class="home-link">开始分析 →</span></span>
          </a>
          <a class="home-option" href="comparison.html#uploadHeading" data-home-new>
            <span class="shortcut-icon" data-icon="chart" aria-hidden="true"></span>
            <strong>比较几个买法</strong>
            <span class="muted">还不确定买哪个？放入 2–5 个备选，按同一份计划比总支出。</span>
            <span class="home-option-meta"><span>2–5 个方案 · 上传截图 → 比较结果</span><span class="home-link">开始比较 →</span></span>
          </a>
        </div>
      </section>

      <section class="panel home-panel" aria-labelledby="homeRightsTitle">
        <div class="section-heading">
          <div class="home-panel-heading"><span class="shortcut-icon" data-tone="sage" data-icon="wallet" aria-hidden="true"></span><h2 id="homeRightsTitle">我的卡包</h2></div>
          <a class="home-link" href="wallet.html">查看卡包<span data-icon="chevron"></span></a>
        </div>
        <div id="homeRights" class="activity-list" aria-live="polite"><p class="home-empty">正在读取卡包和临期事项…</p></div>
      </section>
    </div>

    <section class="flat-section home-recent" id="homeRecent" aria-labelledby="homeRecentTitle">
      <div class="section-heading"><h2 id="homeRecentTitle">历史任务</h2></div>
      <div id="homeRecentList" class="activity-list"></div>
    </section>
  </main>
</div>
<script src="app-shell.js" defer></script><script src="wallet-client.js" defer></script><script src="recent-analysis.js" defer></script><script src="home-ui.js" defer></script>
</body>
</html>
